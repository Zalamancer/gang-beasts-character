<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gang Beast Character</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #232a36; }
  #app { width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 14px; left: 14px;
    font: 600 13px/1.5 system-ui, sans-serif;
    color: #e8edf5; background: rgba(16, 20, 28, 0.55);
    padding: 10px 14px; border-radius: 10px;
    backdrop-filter: blur(6px);
    user-select: none; pointer-events: none;
  }
  #hud .variant { color: #ff5f52; text-transform: uppercase; letter-spacing: 0.06em; }
  #hud .keys { color: #9aa7ba; font-weight: 400; font-size: 12px; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hud">
  <div>GANG BEAST &mdash; <span class="variant" id="variant-name">final</span></div>
  <div class="keys">1/2/3 variants &middot; 0 final &middot; click the beast to poke it &middot; drag to orbit</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
